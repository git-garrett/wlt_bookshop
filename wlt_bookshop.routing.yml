wlt_bookshop.isbn_process:
  path: '/admin/content/wlt-bookshop/isbn-process'
  defaults:
    _form: '\Drupal\wlt_bookshop\Form\BookIsbnProcessForm'
    _title: 'Process Book Review ISBNs'
  requirements:
    _permission: 'administer nodes'
  options:
    _admin_route: TRUE
wlt_bookshop.report_page:
  path: '/admin/reports/wlt-bookshop'
  defaults:
    _form: '\Drupal\wlt_bookshop\Form\ReportForm'
    _title: 'WLT Bookshop report'
  requirements:
    _permission: 'access site reports'
  options:
    _admin_route: TRUE
wlt_bookshop.report_bad_isbn:
  path: '/wlt-bookshop/report-bad-isbn/{node}'
  defaults:
    _controller: '\Drupal\wlt_bookshop\Controller\IsbnAdminController::report'
  requirements:
    _access: 'TRUE'
  options:
    parameters:
      node:
        type: entity:node
wlt_bookshop.check_embed:
  path: '/wlt-bookshop/check-embed'
  defaults:
    _controller: '\Drupal\wlt_bookshop\Controller\IsbnAdminController::check'
  requirements:
    _access: 'TRUE'
wlt_bookshop.remove_isbn:
  path: '/wlt-bookshop/remove-isbn/{node}'
  defaults:
    _controller: '\Drupal\wlt_bookshop\Controller\IsbnAdminController::remove'
  requirements:
    _entity_access: 'node.update'
  options:
    parameters:
      node:
        type: entity:node
    _admin_route: TRUE
