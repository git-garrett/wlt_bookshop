wlt_bookshop.isbn_process:
  path: '/admin/content/wlt-bookshop/isbn-process'
  defaults:
    _form: '\Drupal\wlt_bookshop\Form\BookIsbnProcessForm'
    _title: 'Process Book Review ISBNs'
  requirements:
    _permission: 'administer nodes'
  options:
    _admin_route: TRUE
wlt_bookshop.settings:
  path: '/admin/config/content/wlt-bookshop'
  defaults:
    _form: '\Drupal\wlt_bookshop\Form\WltBookshopSettingsForm'
    _title: 'WLT Bookshop settings'
  requirements:
    _permission: 'administer site configuration'
  options:
    _admin_route: TRUE
