services:
  wlt_bookshop.book_isbn_lookup:
    class: 'Drupal\wlt_bookshop\Service\BookIsbnLookup'
    arguments: ['@http_client', '@logger.channel.wlt_bookshop']

  # Define a dedicated logger channel for this module.
  logger.channel.wlt_bookshop:
    parent: 'logger.channel_base'
    arguments: ['wlt_bookshop']

  cache.wlt_bookshop_bad_isbn:
    class: 'Drupal\\Core\\Cache\\CacheBackendInterface'
    factory: ['@cache.factory', 'get']
    arguments: ['wlt_bookshop_bad_isbn']
    tags:
      - { name: cache.bin }
